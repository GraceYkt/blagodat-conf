<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список участниц — только для организаторов</title>
<style>
:root{--ink:#2b2622;--mut:#7a716a;--bg:#fbf7f2;--card:#fff;--line:#e8ded4;--rose:#b76e79;--rose-d:#9d5560;--err:#c0392b}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:32px 18px}
h1{font-family:Georgia,serif;font-weight:400;font-size:26px;margin-bottom:4px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;border:none;background:var(--rose);color:#fff;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--rose-d)}
.btn2{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:14px}
.btn2:hover{border-color:var(--rose)}
.inp{width:100%;max-width:360px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;outline:none}
.inp:focus{border-color:var(--rose)}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}
.stat .card{margin:0;flex:1;min-width:150px;padding:16px 18px}
.num{font-size:34px;font-family:Georgia,serif}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:#fdfaf7}
.tbl-wrap{overflow-x:auto}
#err{color:var(--err);font-size:14px;margin-top:8px;display:none}
</style>
<base target="_blank">
</head>
<body>
<div class="wrap">

  <h1>Участницы конференции</h1>
  <p class="mut">Страница только для организаторов. Введите пароль, чтобы увидеть список.</p>

  <div id="gate" class="card" style="max-width:480px">
    <div style="margin-bottom:12px"><input class="inp" type="password" id="pwd" placeholder="Пароль организатора"></div>
    <button class="btn" id="open">Открыть список</button>
    <div id="err">Неверный пароль. Проверьте и попробуйте снова.</div>
  </div>

  <div id="panel" style="display:none">
    <div class="stat">
      <div class="card"><div class="mut">Всего заявок</div><div class="num" id="c-all">0</div></div>
      <div class="card"><div class="mut">Заказали питание</div><div class="num" id="c-meal">0</div></div>
      <div class="card"><div class="mut">Последняя заявка</div><div class="num" id="c-last" style="font-size:18px;padding-top:8px">—</div></div>
    </div>
    <div class="card">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <button class="btn2" id="csv">⬇ Скачать CSV (Excel)</button>
        <button class="btn2" id="reload">↻ Обновить</button>
        <span class="mut" id="upd"></span>
      </div>
      <div class="tbl-wrap"><table id="tbl"></table></div>
    </div>
  </div>

</div>

<script>
var APP_URL = "https://script.google.com/macros/s/AKfycby_qk9MaZr4fpBq9ObNPwWDYvmkvKU2A6RRMBPS2_-de2JtrLqE2TfAub2KWUwgMvQ99w/exec";
var rows = [];

function load(key){
  return new Promise(function(res, rej){
    var cb = "cb_" + Date.now();
    window[cb] = function(data){ delete window[cb]; res(data) };
    var s = document.createElement("script");
    s.src = APP_URL + "?key=" + encodeURIComponent(key) + "&callback=" + cb;
    s.onerror = function(){ delete window[cb]; rej() };
    document.body.appendChild(s);
    setTimeout(function(){ if(window[cb]){ delete window[cb]; rej(new Error("timeout")) } }, 15000);
  });
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }

function render(){
  document.getElementById("c-all").textContent = rows.length;
  document.getElementById("c-meal").textContent = rows.filter(function(r){return r.meal&&r.meal.indexOf("да")===0}).length;
  document.getElementById("c-last").textContent = rows.length? rows[rows.length-1].ts : "—";
  var h = "<tr><th>Фамилия</th><th>Имя</th><th>Телефон</th><th>Email</th><th>Питание</th><th>Дата заявки</th></tr>";
  rows.forEach(function(r){
    h += "<tr><td>"+esc(r.last)+"</td><td>"+esc(r.first)+"</td><td><b>"+esc(r.phone)+"</b></td><td>"+esc(r.email)+"</td><td>"+esc(r.meal)+"</td><td class='mut'>"+esc(r.ts)+"</td></tr>";
  });
  document.getElementById("tbl").innerHTML = h;
  document.getElementById("upd").textContent = "Обновлено: " + new Date().toLocaleTimeString("ru-RU");
}

function openList(){
  var key = document.getElementById("pwd").value.trim();
  if(!key) return;
  load(key).then(function(data){
    if(!data || data.ok !== true){ document.getElementById("err").style.display="block"; return; }
    document.getElementById("err").style.display="none";
    document.getElementById("gate").style.display="none";
    document.getElementById("panel").style.display="block";
    rows = data.rows || [];
    try{ sessionStorage.setItem("wconf_key", key) }catch(e){}
    render();
  }).catch(function(){ document.getElementById("err").style.display="block"; });
}

document.getElementById("open").addEventListener("click", openList);
document.getElementById("pwd").addEventListener("keydown", function(e){ if(e.key==="Enter") openList() });
document.getElementById("reload").addEventListener("click", openList);
document.getElementById("csv").addEventListener("click", function(){
  if(!rows.length) return;
  var h=["Фамилия","Имя","Телефон","Email","Питание","Дата заявки"];
  function q(s){s=String(s==null?"":s);return '"'+s.replace(/"/g,'""')+'"'}
  var body=rows.map(function(r){return [r.last,r.first,r.phone,r.email,r.meal,r.ts].map(q).join(";")});
  var blob=new Blob(["\ufeff"+h.map(q).join(";")+"\n"+body.join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="uchastnitsy_konferencii.csv";
  document.body.appendChild(a);a.click();a.remove();
});

try{
  var saved = sessionStorage.getItem("wconf_key");
  if(saved){ document.getElementById("pwd").value = saved; openList(); }
}catch(e){}
</script>
</body>
</html>
